      🔊
   <script>
  // ======================================================== 
  // ✨ 1. SCROLL REVEAL & CHARMING MOTION EFFECTS ✨                             
  // ======================================================== 
  document.addEventListener("DOMContentLoaded", function() {

    // --- A. Scroll Reveal (Fades items in as you scroll down) ---
    const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
    const observer = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.style.opacity = "1";
          entry.target.style.transform = "translateY(0)";
          observer.unobserve(entry.target); 
        }
      });
    }, observerOptions);

    const elementsToAnimate = document.querySelectorAll('.branding2, .posters, .ui-ux, .background15, .gemini-container');
    elementsToAnimate.forEach(el => {
      el.style.opacity = "0";
      el.style.transform = "translateY(40px)";
      el.style.transition = "opacity 0.8s ease-out, transform 0.8s ease-out";
      observer.observe(el);
    });

    // --- B. THE FIX: Restores the Charming Motion Shine Effect ---
    const labels = document.querySelectorAll('.branding2, .posters, .ui-ux');
    labels.forEach(label => {
      const text = label.textContent.trim();
      if (!text) return; 
      
      label.innerHTML = ''; // Clears the static text
      // Breaks the text into individual letters for the wave effect
      text.split('').forEach((char, index) => {
        const span = document.createElement('span');
        span.textContent = char === ' ' ? '\u00A0' : char; 
        span.className = 'char-shine';
        
        // This delay creates the sequential wave motion!
        span.style.animationDelay = `${index * 0.15}s`;
        label.appendChild(span);
      });
    });

  }); // End DOMContentLoaded


  // ======================================================== 
  // ✨ 2. INDEPENDENT LAYER DRAGGING (STACKED CARDS) ✨                             
  // ======================================================== 
  let currentDragElement = null;
  let startY = 0;
  let initialTranslateY = 0;

  const handleSelector = '.background6, .background7, .background8, .background9, .background10, .background11, .background12, .background13';

  window.addEventListener('mousedown', (e) => {
    const handle = e.target.closest(handleSelector);
    if (handle) {
      e.preventDefault(); 
      currentDragElement = handle;
      startY = e.clientY;

      // Calculates where the layer currently is so it doesn't snap back to 0
      const style = window.getComputedStyle(handle);
      const matrix = new DOMMatrixReadOnly(style.transform);
      initialTranslateY = matrix.m42; 

      handle.classList.add('is-dragging');
    }
  });

  const stopDragging = () => {
    if (currentDragElement) {
      currentDragElement.classList.remove('is-dragging');
      currentDragElement = null; 
    }
  };

  window.addEventListener('mouseup', stopDragging);
  window.addEventListener('mouseleave', stopDragging);

  window.addEventListener('mousemove', (e) => {
    if (!currentDragElement) return;
    e.preventDefault();
    
    const y = e.clientY;
    const distance = y - startY; 
    
    // Physically moves ONLY the specific element you grabbed up and down
    currentDragElement.style.transform = `translateY(${initialTranslateY + distance}px)`;
  });
  // ========================================== 
      // 🎵 SMART AUTOPLAY CONTROLLER SCRIPT 🎵              
      // ========================================== 
      document.addEventListener("DOMContentLoaded", function() {
        const music = document.getElementById("bg-music");
        const toggleBtn = document.getElementById("music-toggle");

        music.volume = 0.3; 

        // 1. Attempt to autoplay immediately when the page loads
        let playPromise = music.play();

        if (playPromise !== undefined) {
          playPromise.then(_ => {
            // SUCCESS: Browser allowed it!
            toggleBtn.innerHTML = "🔊";
            toggleBtn.style.boxShadow = "0px 0px 20px rgba(255, 183, 244, 0.8)";
          }).catch(error => {
            // BLOCKED: Browser blocked it. Show mute icon.
            toggleBtn.innerHTML = "🔇";
            
            // Wait for the user to click literally ANYTHING on the page, then start the music.
            const startMusicOnInteraction = () => {
              music.play();
              toggleBtn.innerHTML = "🔊";
              toggleBtn.style.boxShadow = "0px 0px 20px rgba(255, 183, 244, 0.8)";
              // Remove this listener so it doesn't try to restart on every single click
              document.removeEventListener("click", startMusicOnInteraction);
            };
            
            document.addEventListener("click", startMusicOnInteraction);
          });
        }

        // Make the button hover smoothly
        toggleBtn.addEventListener("mouseover", () => toggleBtn.style.transform = "scale(1.1)");
        toggleBtn.addEventListener("mouseout", () => toggleBtn.style.transform = "scale(1)");

        // Manual Play/Pause if the user clicks the actual button
        toggleBtn.addEventListener("click", (e) => {
          e.stopPropagation(); // Stops this click from triggering the "anywhere" click
          if (music.paused) {
            music.play();
            toggleBtn.innerHTML = "🔊"; 
            toggleBtn.style.boxShadow = "0px 0px 20px rgba(255, 183, 244, 0.8)"; 
          } else {
            music.pause();
            toggleBtn.innerHTML = "🔇"; 
            toggleBtn.style.boxShadow = "0px 10px 25px rgba(0,0,0,0.5)"; 
          }
        });
      });
</script>
